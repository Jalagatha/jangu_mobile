name: Keep Render service awake

# Render's free web service spins down after 15 minutes with no traffic; the
# next request then eats a ~1 minute cold start. This workflow pings the health
# endpoint every 10 minutes so the instance never goes idle long enough to sleep.
#
# Set the URL once (Settings -> Secrets and variables -> Actions -> Variables):
#   KEEP_AWAKE_URL = https://<your-service>.onrender.com/api/schema/
# If unset it falls back to the hostname from the deploy docs.
#
# NOTE: GitHub disables scheduled workflows after 60 days with no commits to the
# default branch. Any push to main re-arms it. Use "Run workflow" below to test.

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min, UTC; GitHub may delay runs under load
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping health endpoint
        env:
          URL: ${{ vars.KEEP_AWAKE_URL || 'https://jango-backend.onrender.com/api/schema/' }}
        run: |
          echo "Pinging $URL"
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
                      --max-time 120 --retry 4 --retry-delay 15 --retry-max-time 300 \
                      "$URL")
          echo "HTTP $code"
          case "$code" in
            2??|3??) echo "Service is awake."; exit 0 ;;
            *)       echo "Unexpected status $code"; exit 1 ;;
          esac
